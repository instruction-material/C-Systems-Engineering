name: Required C17 source contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    name: C17 required packs (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Ensure debugger and binary inspection prerequisites
        run: |
          if ! command -v gdb || ! command -v nm || ! command -v objdump; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y gdb binutils
          fi
          gdb --version
          nm --version
          objdump --version
      - name: Verify native contracts and intentional failures
        env:
          CSE_CC: ${{ matrix.compiler }}
          CSE_PARENT_TASK_ID: c17-source-${{ github.run_id }}-${{ matrix.compiler }}
        run: |
          python3 test/native_opening_contracts.py
          python3 test/native_dispatch_contracts.py
          python3 test/native_math_contracts.py
          python3 test/native_tooling_contracts.py
          python3 test/native_inspector_contracts.py
